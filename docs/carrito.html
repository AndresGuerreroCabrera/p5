<!DOCTYPE html>
<html lang="es">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGCDrones - Carrito</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/carrito.js" defer></script>
</head>

<body>
  <header class="site-header">
    <h1>AGCDrones</h1>
    <p>Revisa los productos añadidos a tu carrito</p>

    <nav class="main-nav">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="carrito.html">Carrito (<span id="contador-carrito">0</span>)</a>
      <a href="checkout.html">Checkout</a>
    </nav>
  </header>

  <main>
    <section class="featured">
      <h2>Tu carrito</h2>

      <p id="mensaje-api" class="mensaje-api"></p>

      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Precio unitario</th>
            <th>Unidades</th>
            <th>Total línea</th>
            <th>Acciones</th>
          </tr>
        </thead>

        <tbody id="tbody-carrito">
          <tr>
            <td colspan="5">Cargando carrito...</td>
          </tr>
        </tbody>
      </table>

      <p class="total-carrito">
        <strong>Total:</strong>
        <span id="total-carrito">0 €</span>
      </p>

      <p>
        <a id="btn-checkout" class="button" href="checkout.html">Finalizar compra</a>
        <a class="button button-secondary" href="productos.html">Seguir comprando</a>
      </p>
    </section>
  </main>

</body>
</html>
