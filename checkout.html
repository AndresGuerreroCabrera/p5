<!DOCTYPE html>
<html lang="es">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGCDrones - Checkout</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <h1>AGCDrones</h1>
    <p>Completa tus datos para finalizar el pedido.</p>

    <nav class="main-nav">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="carrito.html">Carrito</a>
      <a href="checkout.html">Checkout</a>
    </nav>
  </header>

  <main>
    <section class="featured">
      <h2>Formulario de compra</h2>
      <p>
        Rellena este formulario con tus datos de contacto y envío
      </p>

      <form action="#" method="post" class="checkout-form">
        <div class="form-group">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono">
        </div>

        <div class="form-group">
          <label for="direccion">Dirección de envío</label>
          <input type="text" id="direccion" name="direccion" required>
        </div>

        <div class="form-group">
          <label for="ciudad">Ciudad</label>
          <input type="text" id="ciudad" name="ciudad" required>
        </div>

        <div class="form-group">
          <label for="postal">Código postal</label>
          <input type="text" id="postal" name="postal" required>
        </div>

        <div class="form-group">
          <label for="envio">Método de envío</label>
          <select id="envio" name="envio">
            <option value="estandar">Envío estándar</option>
            <option value="express">Exprés</option>
            <option value="recogida">Recogida en tienda</option>
          </select>
        </div>

        <div class="form-group">
          <label for="comentarios">Comentarios adicionales</label>
          <textarea id="comentarios" name="comentarios" rows="5"></textarea>
        </div>

        <div class="form-check">
          <input type="checkbox" id="condiciones" name="condiciones" required>
          <label for="condiciones">Acepto las condiciones de compra</label>
        </div>

        <div class="form-group">
          <button type="submit" class="button">Finalizar pedido</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
